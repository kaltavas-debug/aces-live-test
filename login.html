<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Aces Live</title>
  <script type="module" src="https://widgets.prod.cleeng.com/cleeng.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="flow-page">
  <header class="site-nav flow-nav">
    <a class="logo" href="./index.html"><span class="aces-mark">A</span><span>ACES LIVE</span></a>
    <div class="nav-actions"><a class="nav-link" href="./index.html">HOME</a><a class="nav-cta" data-checkout-link href="./checkout.html?couponCode=NEVERFOLD">START STREAMING</a></div>
  </header>

  <main class="flow-shell">
    <div class="flow-heading"><span class="eyebrow">ACES LIVE</span><h1>LOGIN</h1><p>Sign in to your Aces Live account. Once you are authenticated, this page will take you back to the Aces Live home page.</p></div>
    <div class="widget-card">
      <div data-cleeng-widget="login" data-cleeng-publisher-id="279964512" data-cleeng-language="en-US"></div>
    </div>
    <div class="flow-actions"><a class="back-link" href="./index.html">← BACK TO ACES LIVE</a><span class="status-pill"><span class="status-dot"></span><span data-auth-status>SIGNED OUT</span></span></div>
  </main>

  <script src="./common.js"></script>
  <script>
    let initialAuthEventSeen = false;
    window.addEventListener("aces-auth-change", (event) => {
      const { loggedIn } = event.detail;
      if (!initialAuthEventSeen) {
        initialAuthEventSeen = true;
        if (loggedIn) window.location.href = "./index.html";
        return;
      }
      if (loggedIn) window.location.href = "./index.html";
    });
  </script>
</body>
</html>
